<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200">
<defs>
  <linearGradient id="statGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7aa2f7"/>
    <stop offset="100%" stop-color="#bb9af7"/>
  </linearGradient>
  <linearGradient id="shimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
    <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<rect width="820" height="200" rx="12" fill="#1a1b26"/>
